<!doctype html>
<html lang="de" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nick Tissen</title>
<meta name="description" content="Nick Tissen — @reblady">
<meta name="theme-color" content="#1a1712">
<meta property="og:title" content="Nick Tissen">
<meta property="og:description" content="Nick Tissen — @reblady">
<meta property="og:type" content="website">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

<script>
  // Set the theme before the first paint so nothing flashes.
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('theme'); } catch (e) {}
    var theme = saved === 'light' || saved === 'dark'
      ? saved
      : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,900;1,9..144,400&family=Space+Grotesk:wght@400;500&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<canvas id="stage" class="stage" aria-hidden="true"></canvas>

<div class="boot" id="boot" role="button" tabindex="0" aria-label="Seite starten">
  <div class="boot__inner">
    <p class="boot__title">NICK TISSEN</p>
    <p class="boot__sub">@REBLADY</p>
    <p class="boot__start">PRESS START</p>
    <p class="boot__hint">Klicken, tippen oder Enter</p>
  </div>
</div>

<div class="viewfinder" id="viewfinder" aria-hidden="true">
  <span class="viewfinder__corner viewfinder__corner--tl"></span>
  <span class="viewfinder__corner viewfinder__corner--tr"></span>
  <span class="viewfinder__corner viewfinder__corner--bl"></span>
  <span class="viewfinder__corner viewfinder__corner--br"></span>
  <span class="viewfinder__focus"></span>
  <p class="viewfinder__label viewfinder__label--tl"><span class="viewfinder__rec"></span>FOTO</p>
  <p class="viewfinder__label viewfinder__label--tr">▮▮▮▯</p>
  <p class="viewfinder__label viewfinder__label--bl">1/250 &nbsp;F2.8 &nbsp;ISO 400</p>
  <p class="viewfinder__label viewfinder__label--br">0042</p>
</div>

<div class="controls">
  <button type="button" class="glass glass-button" id="soundToggle" aria-pressed="true" aria-label="Ton ausschalten">
    <svg class="icon icon--on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>
    <svg class="icon icon--off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
  </button>
  <button type="button" class="glass glass-button" id="themeToggle" aria-label="Theme wechseln">
    <svg class="icon icon--sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.4"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5.3 5.3l1.7 1.7M17 17l1.7 1.7M5.3 18.7L7 17M17 7l1.7-1.7"/></svg>
    <svg class="icon icon--moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></svg>
  </button>
</div>

<main class="hero" id="hero" aria-hidden="true">
  <section class="glass panel">
    <p class="panel__handle">@reblady</p>
    <h1 class="panel__name">NICK<br>TISSEN</h1>
    <p class="panel__motto">„Platzhalter-Motto — kommt noch.“</p>
    <div class="glass chip">
      <span class="chip__dot" id="discordDot" data-status="loading"></span>
      <span id="discordText">Discord-Status wird geladen…</span>
    </div>
  </section>
</main>

<svg class="defs" aria-hidden="true">
  <filter id="liquid" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.006 0.011" numOctaves="2" seed="11" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="42" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<script type="module" src="js/main.js"></script>
</body>
</html>
