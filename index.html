<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nick Tissen / @reblady</title>
<meta name="description" content="Nick Tissen (@reblady) — YouTube, Projekte und die wichtigsten Links an einem Ort.">

<!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:title" content="Nick Tissen / @reblady">
<meta property="og:description" content="YouTube, Projekte und die wichtigsten Links an einem Ort.">
<meta property="og:url" content="https://reblady.de">
<meta property="og:image" content="https://reblady.de/assets/og-image.png">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Ambient background layers -->
<div class="bg" aria-hidden="true">
  <div class="bg__orb bg__orb--1"></div>
  <div class="bg__orb bg__orb--2"></div>
  <div class="bg__grain"></div>
</div>

<!-- Theme toggle -->
<button id="themeToggle" class="theme-toggle glass" type="button" aria-label="Theme wechseln" data-r="20">
  <span class="theme-toggle__icon" id="themeIcon" aria-hidden="true"></span>
</button>

<!-- Condensed header, shown on scroll -->
<header class="mini-header" id="miniHeader">
  <div class="mini-header__pill glass" data-r="26">
    <span class="mini-header__name" data-i18n="hero.name">Nick Tissen</span>
    <span class="mini-header__handle" data-i18n="hero.handle">@reblady</span>
  </div>
</header>

<main>

  <section class="hero" id="hero">
    <h1 class="hero__name" data-i18n="hero.name">Nick Tissen</h1>
    <p class="hero__motto" data-i18n="hero.motto">Content, Code und was gerade entsteht.</p>
    <p class="hero__handle" data-i18n="hero.handle">@reblady</p>

    <div class="status-chip glass" id="statusChip" data-r="18">
      <span class="status-chip__dot" id="statusDot"></span>
      <span class="status-chip__text" id="statusText" data-i18n="status.loading">Status wird geladen …</span>
    </div>
  </section>

  <section class="section" id="featured" data-reveal>
    <p class="section__label" data-i18n="featured.label">Aktuell</p>
    <article class="featured-card glass" data-r="30">
      <div class="featured-card__thumb" aria-hidden="true"></div>
      <div class="featured-card__body">
        <h2 class="featured-card__title" data-i18n="featured.title">Aktuelles Projekt</h2>
        <p class="featured-card__desc" data-i18n="featured.desc">Woran ich gerade arbeite — folgt in Kürze.</p>
        <a class="featured-card__link" href="#" id="featuredLink" data-i18n="featured.cta">Mehr dazu</a>
      </div>
    </article>
  </section>

  <section class="section" id="updates" data-reveal>
    <p class="section__label" data-i18n="updates.label">Aktuelles</p>
    <ul class="updates-list" id="updatesList">
      <!-- populated from data/updates.json -->
    </ul>
  </section>

</main>

<nav class="dock glass" id="dock" data-r="34" aria-label="Links">
  <a class="dock__primary" href="https://youtube.com/@reblady" target="_blank" rel="noopener">
    <svg class="dock__icon-svg" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <rect x="2" y="5" width="20" height="14" rx="4" fill="currentColor" opacity="0.15"/>
      <path d="M10 9.5L15 12L10 14.5V9.5Z" fill="currentColor"/>
    </svg>
    <span data-i18n="links.youtube">YouTube</span>
  </a>

  <div class="dock__icons">
    <a class="dock__icon" href="https://instagram.com/nick_tissen" target="_blank" rel="noopener" aria-label="Instagram">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="4" y="4" width="16" height="16" rx="5" stroke="currentColor" stroke-width="1.6"/>
        <circle cx="12" cy="12" r="3.6" stroke="currentColor" stroke-width="1.6"/>
        <circle cx="16.6" cy="7.4" r="1" fill="currentColor"/>
      </svg>
    </a>
    <a class="dock__icon" href="https://github.com/reblady" target="_blank" rel="noopener" aria-label="GitHub">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 3.5c-4.7 0-8.5 3.8-8.5 8.5 0 3.8 2.4 6.9 5.8 8 .4.1.6-.2.6-.4v-1.6c-2.4.5-2.9-1.1-2.9-1.1-.4-1-1-1.3-1-1.3-.8-.5.1-.5.1-.5.9.1 1.4.9 1.4.9.8 1.4 2.1 1 2.6.7.1-.6.3-1 .6-1.2-1.9-.2-4-1-4-4.2 0-.9.3-1.7.9-2.3-.1-.2-.4-1.1.1-2.3 0 0 .7-.2 2.4.9.7-.2 1.4-.3 2.2-.3.7 0 1.5.1 2.2.3 1.7-1.1 2.4-.9 2.4-.9.5 1.2.2 2.1.1 2.3.6.6.9 1.4.9 2.3 0 3.2-2 4-3.9 4.2.3.3.6.8.6 1.6v2.4c0 .2.2.5.6.4 3.4-1.1 5.8-4.2 5.8-8C20.5 7.3 16.7 3.5 12 3.5Z" fill="currentColor"/>
      </svg>
    </a>
    <a class="dock__icon" href="https://steamcommunity.com/id/reblady" target="_blank" rel="noopener" aria-label="Steam">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.6"/>
        <circle cx="9.5" cy="14.5" r="1.7" stroke="currentColor" stroke-width="1.4"/>
        <path d="M11 13.2L14 10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        <circle cx="15" cy="9" r="1.8" stroke="currentColor" stroke-width="1.4"/>
      </svg>
    </a>
    <a class="dock__icon" href="mailto:hallo@reblady.de" aria-label="E-Mail">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="3.5" y="5.5" width="17" height="13" rx="2.5" stroke="currentColor" stroke-width="1.6"/>
        <path d="M4.5 7L12 12.5L19.5 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
  </div>
</nav>

<script src="script.js" defer></script>
</body>
</html>
