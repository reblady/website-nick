<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nick Tissen — reblady</title>
<meta name="description" content="Nick Tissen (@reblady) — Coding-Projekte, YouTube und was sonst noch entsteht.">

<meta property="og:title" content="Nick Tissen — reblady">
<meta property="og:description" content="Coding-Projekte, YouTube und was sonst noch entsteht.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://reblady.de/">
<meta property="og:image" content="assets/og-image.jpg">

<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">

<!-- theme + low-power flags are resolved before first paint to avoid a flash of the wrong look -->
<script>
(function () {
  try {
    var stored = localStorage.getItem('reblady-theme');
    var theme = stored || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
    if (localStorage.getItem('reblady-low-power') === '1') {
      document.documentElement.classList.add('low-power');
    }
  } catch (e) {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
})();
</script>
</head>
<body>

  <!-- ambient background gradient, theme-driven -->
  <div class="ambient" aria-hidden="true"></div>

  <!-- global theme switch, always reachable top right -->
  <button class="theme-toggle glass glass--refract" id="themeToggle" type="button" aria-label="Theme wechseln">
    <span class="theme-toggle__track">
      <span class="theme-toggle__dot"></span>
    </span>
  </button>

  <!-- condensed header, fades in once the hero has scrolled away -->
  <header class="mini-header glass glass--refract" id="miniHeader">
    <span class="mini-header__name">Nick Tissen</span>
    <span class="mini-header__handle">@reblady</span>
  </header>

  <main>

    <!-- HERO / POSTER -->
    <section class="hero" id="hero">
      <div class="hero__inner">
        <h1 class="hero__name load-in load-in--1">
          <span class="hero__name-line">NICK</span>
          <span class="hero__name-line">TISSEN</span>
        </h1>

        <p class="hero__motto load-in load-in--2">Content, Code und was gerade sonst noch entsteht.</p>

        <div class="hero__meta load-in load-in--3">
          <span class="hero__handle">@reblady</span>
          <span class="hero__status glass" id="discordStatus" hidden>
            <span class="hero__status-dot" id="discordStatusDot"></span>
            <span id="discordStatusText">—</span>
          </span>
        </div>
      </div>

      <div class="hero__scroll-cue" aria-hidden="true">
        <span>scrollen</span>
        <div class="hero__scroll-line"></div>
      </div>
    </section>

    <!-- PINNED HORIZONTAL LINK GALLERY -->
    <section class="gallery-pin" id="galleryPin">
      <div class="gallery-pin__sticky">
        <div class="gallery-pin__track" id="galleryTrack">

          <a class="link-card link-card--featured glass--faux" href="https://www.youtube.com/@reblady" target="_blank" rel="noopener">
            <span class="link-card__icon">
              <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-youtube"></use></svg>
            </span>
            <span class="link-card__body">
              <span class="link-card__title">YouTube</span>
              <span class="link-card__desc">Videos &amp; Projekte — @reblady</span>
            </span>
          </a>

          <a class="link-card glass--faux" href="https://instagram.com/nick_tissen" target="_blank" rel="noopener">
            <span class="link-card__icon">
              <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-instagram"></use></svg>
            </span>
            <span class="link-card__body">
              <span class="link-card__title">Instagram</span>
              <span class="link-card__desc">@nick_tissen</span>
            </span>
          </a>

          <a class="link-card glass--faux" href="#" target="_blank" rel="noopener" id="discordInviteLink">
            <span class="link-card__icon">
              <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-discord"></use></svg>
            </span>
            <span class="link-card__body">
              <span class="link-card__title">Discord</span>
              <span class="link-card__desc">.reblady — Community</span>
            </span>
          </a>

          <a class="link-card glass--faux" href="https://github.com/reblady" target="_blank" rel="noopener">
            <span class="link-card__icon">
              <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-github"></use></svg>
            </span>
            <span class="link-card__body">
              <span class="link-card__title">GitHub</span>
              <span class="link-card__desc">Projects &amp; Code</span>
            </span>
          </a>

          <a class="link-card glass--faux" href="https://steamcommunity.com/id/reblady" target="_blank" rel="noopener">
            <span class="link-card__icon">
              <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-steam"></use></svg>
            </span>
            <span class="link-card__body">
              <span class="link-card__title">Steam</span>
              <span class="link-card__desc">reblady</span>
            </span>
          </a>

        </div>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <span class="site-footer__detail">reblady.de</span>
    <button class="low-power-toggle" type="button" id="lowPowerToggle" aria-pressed="false">Leichter Modus</button>
  </footer>

  <!-- inline icon sprite: simple original glyphs, not brand logos -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="icon-youtube" viewBox="0 0 24 24"><path d="M4 8.5A3.5 3.5 0 0 1 7.5 5h9A3.5 3.5 0 0 1 20 8.5v7a3.5 3.5 0 0 1-3.5 3.5h-9A3.5 3.5 0 0 1 4 15.5v-7Z" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 9.2v5.6l4.8-2.8-4.8-2.8Z" fill="currentColor"/></symbol>
    <symbol id="icon-instagram" viewBox="0 0 24 24"><rect x="4.5" y="4.5" width="15" height="15" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="12" r="3.4" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="16.2" cy="7.8" r="1" fill="currentColor"/></symbol>
    <symbol id="icon-discord" viewBox="0 0 24 24"><path d="M6 9.5c0-2.2 1.6-3.9 3.7-4.3.2.4.4.9.5 1.3a10 10 0 0 1 3.6 0c.1-.4.3-.9.5-1.3C16.4 5.6 18 7.3 18 9.5v5.3c0 2-1.9 3.5-4.5 3.9-.3-.4-.5-.9-.7-1.3a7 7 0 0 1-1.6.2 7 7 0 0 1-1.6-.2c-.2.4-.4.9-.7 1.3C6.9 18.3 5 16.8 5 14.8V9.5Z" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="9.7" cy="11.8" r="1.1" fill="currentColor"/><circle cx="14.3" cy="11.8" r="1.1" fill="currentColor"/></symbol>
    <symbol id="icon-github" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M9.5 16.2c-2-.6-2.8-1.9-2.8-3.5 0-.8.3-1.5.8-2.1-.1-.4-.3-1.1.1-2 0 0 .7-.2 2.2.8a7.6 7.6 0 0 1 4 0c1.5-1 2.2-.8 2.2-.8.4.9.2 1.6.1 2 .5.6.8 1.3.8 2.1 0 1.6-.8 2.9-2.8 3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-steam" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="14.2" cy="9.8" r="1.9" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M7.5 15.3 10.8 13a2.6 2.6 0 0 1 2.4-2.9M7.5 15.3a1.9 1.9 0 1 0 3.5-1.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
  </svg>

  <script src="script.js" defer></script>
</body>
</html>
